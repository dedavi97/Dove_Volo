<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1116">
  <meta name="description" content="Costruisci viaggi in più tappe con voli diretti in Europa.">
  <title>Dove_Volo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E1116'/%3E%3Cpath d='M7 23C11 11 21 9 25 9' fill='none' stroke='%234FA3FF' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='7' cy='23' r='3.5' fill='%23E6EDF3'/%3E%3Ccircle cx='25' cy='9' r='3' fill='%234FA3FF'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="sito/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="sito/stile.css">
</head>
<body>
  <header class="testata">
    <h1>Dove_Volo</h1>
    <span class="versione" id="versione"></span>
  </header>

  <div class="ricerca">
    <label for="partenza">Partenza</label>
    <div class="ricerca-campo">
      <input id="partenza" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="Città o codice, es. Torino o TRN"
             role="combobox" aria-expanded="false" aria-controls="suggerimenti" aria-autocomplete="list">
      <button id="togli-partenza" class="togli-partenza" type="button" aria-label="Togli la partenza" title="Togli la partenza" hidden>&times;</button>
      <ul id="suggerimenti" class="suggerimenti" role="listbox" aria-label="Aeroporti trovati" hidden></ul>
    </div>
  </div>

  <nav id="giro" class="giro" aria-label="Il tuo giro" hidden>
    <div class="giro-riga">
      <ol id="catena" class="catena"></ol>
      <button id="ricomincia" class="ricomincia" type="button">Ricomincia</button>
    </div>
    <p id="messaggio-giro" class="messaggio-giro" role="status" hidden></p>
  </nav>

  <main class="principale">
    <div id="mappa" class="mappa" aria-label="Mappa delle rotte"></div>

    <aside class="legenda" aria-label="Legenda">
      <span class="voce-legenda"><i class="linea linea-attiva"></i>Attiva</span>
      <span class="voce-legenda"><i class="linea linea-stagionale"></i>Stagionale</span>
      <span id="legenda-giro" class="voce-legenda" hidden><i class="linea linea-giro"></i>Il tuo giro</span>
    </aside>

    <section id="pannello" class="pannello" aria-label="Mete dirette">
      <button id="maniglia" class="maniglia" type="button" aria-label="Allarga o riduci il pannello">
        <span class="maniglia-segno"></span>
        <span id="titolo" class="pannello-titolo">Caricamento dei dati...</span>
      </button>
      <div id="filtri" class="filtri" hidden>
        <button id="filtro-attive" class="pillola pillola-attive" type="button" aria-pressed="true">Attive</button>
        <button id="filtro-stagionali" class="pillola pillola-stagionali" type="button" aria-pressed="true">Stagionali</button>
        <label class="pillola pillola-paese">
          <span class="nascosto">Paese</span>
          <select id="filtro-paese"></select>
        </label>
      </div>
      <p id="avviso" class="avviso" hidden></p>
      <div class="scorrimento">
        <p id="vuoto" class="vuoto" hidden></p>
        <ul id="lista" class="lista"></ul>
        <footer id="fonti" class="fonti"></footer>
      </div>
    </section>
  </main>

  <script src="sito/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="sito/app.js"></script>
</body>
</html>
